name: Android Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: google-play-testing
  cancel-in-progress: false

jobs:
  build-android:
    name: Build and Publish Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify code
        run: |
          flutter analyze
          flutter test

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/avijit-sahyog-upload.jks

      - name: Create signing properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=avijit-sahyog-upload.jks
          EOF

      - name: Verify upload keystore fingerprint
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "Upload keystore certificate fingerprint:"
          keytool -list -v \
            -keystore android/app/avijit-sahyog-upload.jks \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass "$ANDROID_STORE_PASSWORD" \
            | grep -E "SHA1:|SHA-256:"

      - name: Configure and validate Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing required GitHub Actions variable: GOOGLE_SERVICES_JSON"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[0].client_info.android_client_info.package_name // empty' android/app/google-services.json)
          test "$PROJECT_ID" = "avijitsahyog-firebase"
          test "$PACKAGE_NAME" = "com.avijitsamooh.avijitsahyog"

      - name: Generate unique Play version code
        run: |
          PLAY_VERSION_CODE=$((1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Publishing versionCode: $PLAY_VERSION_CODE"

      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --build-number="$PLAY_VERSION_CODE" \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: avijit-sahyog-release-aab-${{ env.PLAY_VERSION_CODE }}
          path: app/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play Internal and Closed Testing
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.avijitsamooh.avijitsahyog
          releaseFiles: app/flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
          releaseName: CI build ${{ env.PLAY_VERSION_CODE }}
