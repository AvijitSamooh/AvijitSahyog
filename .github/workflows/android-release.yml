name: Android Release Bundle

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Signed Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify code
        run: |
          flutter analyze
          flutter test

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/avijit-sahyog-upload.jks

      - name: Create signing properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=avijit-sahyog-upload.jks
          EOF

      - name: Configure and validate Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing required GitHub Actions secret: GOOGLE_SERVICES_JSON"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[0].client_info.android_client_info.package_name // empty' android/app/google-services.json)
          test "$PROJECT_ID" = "avijitsahyog-firebase"
          test "$PACKAGE_NAME" = "com.avijitsamooh.avijitsahyog"
          MATCHING_WEB_CLIENT_ID=$(jq -r --arg package "$PACKAGE_NAME" '[.client[] | select(.client_info.android_client_info.package_name == $package) | .oauth_client[]? | select(.client_type == 3) | .client_id][0] // empty' android/app/google-services.json)
          if [ -z "$MATCHING_WEB_CLIENT_ID" ]; then
            echo "The package-matched Firebase client does not contain a Web OAuth client (client_type 3)"
            exit 1
          fi

      - name: Build signed app bundle
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }}

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: avijit-sahyog-release-aab
          path: app/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
