name: Android Release Bundle

on:
  workflow_dispatch:
    inputs:
      validation:
        description: 'Release validation level'
        required: true
        default: full
        type: choice
        options:
          - full
          - fast
  schedule:
    - cron: '30 14 * * *'
  push:
    tags:
      - 'v*'
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]

permissions:
  contents: read

concurrency:
  group: google-play-testing
  cancel-in-progress: false

env:
  RELEASE_VALIDATION: ${{ github.event.inputs.validation || 'full' }}
  BACKEND_SERVICE_WINDOW_ENABLED: ${{ vars.BACKEND_SERVICE_WINDOW_ENABLED || 'true' }}
  BACKEND_SERVICE_WINDOW_START: ${{ vars.BACKEND_SERVICE_OFFLINE_START || '21:00' }}
  BACKEND_SERVICE_WINDOW_END: ${{ vars.BACKEND_SERVICE_OFFLINE_END || '08:00' }}

jobs:
  build-android:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: Build and Publish Android App Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Verify code
        if: ${{ env.RELEASE_VALIDATION == 'full' }}
        run: |
          flutter analyze
          flutter test --dart-define=BACKEND_SERVICE_WINDOW_ENABLED=false

      - name: Decode Android upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/avijit-sahyog-upload.jks

      - name: Create signing properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=avijit-sahyog-upload.jks
          EOF

      - name: Configure and validate Firebase for Android
        env:
          GOOGLE_SERVICES_JSON: ${{ vars.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "Missing required GitHub Actions variable: GOOGLE_SERVICES_JSON"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          jq empty android/app/google-services.json

          PROJECT_ID=$(jq -r '.project_info.project_id // empty' android/app/google-services.json)
          PACKAGE_NAME=$(jq -r '.client[0].client_info.android_client_info.package_name // empty' android/app/google-services.json)
          test "$PROJECT_ID" = "avijitsahyog-firebase"
          test "$PACKAGE_NAME" = "com.avijitsamooh.avijitsahyog"

      - name: Generate Play Store version
        run: |
          BASE_VERSION=$(sed -n 's/^version: \([0-9][0-9]*\.[0-9][0-9]*\)\.[0-9][0-9]*.*$/\1/p' pubspec.yaml)
          if [ -z "$BASE_VERSION" ]; then
            echo "Unable to extract major.minor version from pubspec.yaml"
            exit 1
          fi

          MAJOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f1)
          MINOR_VERSION=$(printf '%s' "$BASE_VERSION" | cut -d. -f2)
          RELEASE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}.$(printf '%02d' "$GITHUB_RUN_ATTEMPT")"
          PLAY_VERSION_CODE=$((10#$MAJOR_VERSION * 10000000 + 10#$MINOR_VERSION * 1000000 + GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))

          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
          echo "PLAY_VERSION_CODE=$PLAY_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Publishing versionName: $RELEASE_VERSION"
          echo "Publishing versionCode: $PLAY_VERSION_CODE"

      - name: Build signed app bundle
        id: build_aab
        run: |
          # The production configuration is an overnight OFFLINE window.
          # Protect the release from accidentally reversed repository variables
          # (for example 08:00 -> 21:00, which would disable the app during the day).
          if [ "$BACKEND_SERVICE_WINDOW_ENABLED" = "true" ]; then
            START_MINUTES=$((10#${BACKEND_SERVICE_WINDOW_START%%:*} * 60 + 10#${BACKEND_SERVICE_WINDOW_START##*:}))
            END_MINUTES=$((10#${BACKEND_SERVICE_WINDOW_END%%:*} * 60 + 10#${BACKEND_SERVICE_WINDOW_END##*:}))
            if [ "$START_MINUTES" -lt "$END_MINUTES" ]; then
              echo "::warning::Offline window was configured in the wrong direction ($BACKEND_SERVICE_WINDOW_START -> $BACKEND_SERVICE_WINDOW_END). Reversing it for production."
              ORIGINAL_START="$BACKEND_SERVICE_WINDOW_START"
              BACKEND_SERVICE_WINDOW_START="$BACKEND_SERVICE_WINDOW_END"
              BACKEND_SERVICE_WINDOW_END="$ORIGINAL_START"
            fi
          fi

          echo "Effective backend offline window: $BACKEND_SERVICE_WINDOW_START -> $BACKEND_SERVICE_WINDOW_END"

          flutter build appbundle --release \
            --build-name="$RELEASE_VERSION" \
            --build-number="$PLAY_VERSION_CODE" \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL }} \
            --dart-define=BACKEND_SERVICE_WINDOW_ENABLED="$BACKEND_SERVICE_WINDOW_ENABLED" \
            --dart-define=BACKEND_SERVICE_WINDOW_START="$BACKEND_SERVICE_WINDOW_START" \
            --dart-define=BACKEND_SERVICE_WINDOW_END="$BACKEND_SERVICE_WINDOW_END"

      - name: Assert release manifest excludes Advertising ID
        run: |
          MANIFEST_DIR="build/app/intermediates/merged_manifests/release"
          if [ ! -d "$MANIFEST_DIR" ]; then
            echo "Release merged manifest directory not found: $MANIFEST_DIR"
            exit 1
          fi

          if grep -R --include='AndroidManifest.xml' -n -E 'com\.google\.android\.gms\.permission\.AD_ID' "$MANIFEST_DIR"; then
            echo "Advertising ID permission found in the release merged manifest."
            exit 1
          fi

          echo "Release merged manifest does not declare AD_ID permission."

      - name: Upload AAB artifact
        id: upload_aab_artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: avijit-sahyog-release-aab-${{ env.PLAY_VERSION_CODE }}
          path: app/flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7

      - name: Publish to Google Play Internal and Closed Testing
        if: ${{ success() && steps.build_aab.outcome == 'success' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.avijitsamooh.avijitsahyog
          releaseFiles: app/flutter/build/app/outputs/bundle/release/app-release.aab
          tracks: internal,alpha
          status: completed
          releaseName: CI build ${{ env.PLAY_VERSION_CODE }}
