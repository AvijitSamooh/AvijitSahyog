name: CI
on:
  workflow_dispatch:
  # Validate feature branches through PRs, and validate master after merge.
  # Do not run on every feature-branch push as that duplicates pull_request CI.
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write

jobs:
  backend:
    name: Backend - NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json

      - name: Refresh backend lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh backend lockfile"
          git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}

      - name: Install dependencies
        run: npm ci

      - name: Build

        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Application dependency-injection smoke test
        run: npm run test:e2e -- --runInBand

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/nestjs/coverage

  flutter:
    name: Flutter - Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Install Linux integration-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Integration tests
        run: xvfb-run -a flutter test integration_test -d linux

      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: app/flutter/coverage

