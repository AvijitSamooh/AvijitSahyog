name: CI

on:
  push:
    branches:
      - master
      - 'feature/**'
      - 'release/**'
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  backend:
    name: Backend - NestJS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Prisma CLI needs datasource env vars even for offline schema validation/generation.
      # These are dummy CI values; no database connection is made by these commands.
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma validate

      - name: Generate Prisma client
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Unit tests with coverage
        run: npm run test:cov -- --runInBand

      - name: Upload backend coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/nestjs/coverage

  flutter:
    name: Flutter - Analyze & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/flutter

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate localizations
        run: flutter gen-l10n

      - name: Analyze
        run: flutter analyze

      - name: Tests with coverage
        run: flutter test --coverage

      - name: Upload Flutter coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-coverage
          path: app/flutter/coverage
