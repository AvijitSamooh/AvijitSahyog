name: Cleanup Actions Runs

on:
  workflow_dispatch:
  # Enable scheduled cleanup later when Actions-hour usage allows it.
  # schedule:
  #   - cron: '17 2 * * *'

permissions:
  actions: write

jobs:
  cleanup:
    name: Retain five Android release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Remove non-Android artifacts and related workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Storage policy:
          # - Keep exactly the 5 newest Android release AAB artifacts.
          # - Keep the workflow runs that produced those 5 artifacts.
          # - Delete every other artifact.
          # - Delete every other completed workflow run, including CI and old
          #   cleanup runs. The currently running cleanup job is always kept.
          ANDROID_ARTIFACT_PREFIX='avijit-sahyog-release-aab-'

          declare -A KEEP_ARTIFACT=()
          declare -A KEEP_RUN=()

          mapfile -t ARTIFACTS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, (.workflow_run.id // 0), .name, .expired, .created_at] | @tsv' \
              | sort -t $'\t' -k5,5r
          )

          kept_android=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"

            [[ "$artifact_name" == "${ANDROID_ARTIFACT_PREFIX}"* ]] || continue
            [[ "$artifact_expired" == "true" ]] && continue
            [[ "$artifact_run_id" == "0" ]] && continue

            if [[ $kept_android -lt 5 ]]; then
              KEEP_ARTIFACT["$artifact_id"]=1
              KEEP_RUN["$artifact_run_id"]=1
              kept_android=$((kept_android + 1))
              echo "Keeping Android artifact ${artifact_id} (${artifact_name}, run ${artifact_run_id}, ${artifact_created_at})"
            fi
          done

          echo "Selected ${kept_android} Android release artifact(s) to retain."

          deleted_artifacts=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"

            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue

            echo "Deleting artifact ${artifact_id} (${artifact_name}, run ${artifact_run_id})"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted_artifacts=$((deleted_artifacts + 1))
          done

          mapfile -t RUNS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | [.id, .name, .conclusion, .created_at] | @tsv'
          )

          deleted_runs=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name conclusion created_at <<< "$run"

            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue

            echo "Deleting workflow run ${run_id} (${workflow_name}, ${conclusion}, ${created_at})"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted_runs=$((deleted_runs + 1))
          done

          echo "Cleanup complete; retained ${kept_android} Android release artifacts and their workflow runs; deleted ${deleted_artifacts} artifacts and ${deleted_runs} workflow runs."
