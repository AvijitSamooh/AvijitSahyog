name: Cleanup Actions Runs

on:
  workflow_dispatch:
  # Enable scheduled cleanup later when Actions-hour usage allows it.
  # schedule:
  #   - cron: '17 2 * * *'

permissions:
  actions: write

jobs:
  cleanup:
    name: Validate and retain five Android release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Validate cleanup plan and remove non-retained data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          ANDROID_ARTIFACT_PREFIX='avijit-sahyog-release-aab-'
          MAX_ANDROID_ARTIFACTS=5

          declare -A KEEP_ARTIFACT=()
          declare -A KEEP_RUN=()
          declare -A KNOWN_RUN=()

          # ------------------------------------------------------------------
          # PHASE 1: READ + VALIDATE. Absolutely no DELETE calls are allowed
          # before this phase completes successfully.
          # ------------------------------------------------------------------
          mapfile -t ARTIFACTS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, (.workflow_run.id // 0), .name, .expired, .created_at] | @tsv' \
              | sort -t $'\t' -k5,5r
          )

          mapfile -t RUNS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | [.id, .name, .status, .conclusion, .created_at] | @tsv'
          )

          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            KNOWN_RUN["$run_id"]=1
          done

          android_candidates=0
          android_invalid=0
          kept_android=0

          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ "$artifact_name" == "${ANDROID_ARTIFACT_PREFIX}"* ]] || continue
            [[ "$artifact_expired" == "true" ]] && continue

            android_candidates=$((android_candidates + 1))

            # Every non-expired Android release artifact must have a real,
            # currently known workflow-run ID. If not, fail closed.
            if [[ "$artifact_run_id" == "0" || -z "${KNOWN_RUN[$artifact_run_id]:-}" ]]; then
              echo "ERROR: Android artifact ${artifact_id} (${artifact_name}) cannot be safely mapped to an existing workflow run."
              android_invalid=$((android_invalid + 1))
              continue
            fi

            if [[ $kept_android -lt $MAX_ANDROID_ARTIFACTS ]]; then
              KEEP_ARTIFACT["$artifact_id"]=1
              KEEP_RUN["$artifact_run_id"]=1
              kept_android=$((kept_android + 1))
              echo "PLAN KEEP artifact=${artifact_id} name=${artifact_name} run=${artifact_run_id} created=${artifact_created_at}"
            fi
          done

          # Fail closed in every ambiguous state. In particular, never treat
          # an empty/malformed Android result as permission to delete history.
          if [[ "$android_invalid" -gt 0 ]]; then
            echo "ERROR: ${android_invalid} Android release artifact(s) could not be validated. NOTHING WILL BE DELETED."
            exit 1
          fi

          if [[ "$android_candidates" -eq 0 ]]; then
            echo "ERROR: No non-expired Android release artifacts were found. NOTHING WILL BE DELETED."
            exit 1
          fi

          if [[ "$kept_android" -eq 0 ]]; then
            echo "ERROR: No Android release artifacts were selected. NOTHING WILL BE DELETED."
            exit 1
          fi

          # Verify every retained run still exists in the run listing before
          # any artifact or workflow deletion occurs.
          for retained_run_id in "${!KEEP_RUN[@]}"; do
            if [[ -z "${KNOWN_RUN[$retained_run_id]:-}" ]]; then
              echo "ERROR: Retained Android artifact points to missing run ${retained_run_id}. NOTHING WILL BE DELETED."
              exit 1
            fi
          done

          echo ""
          echo "VALIDATION PASSED"
          echo "Android release artifacts found: ${android_candidates}"
          echo "Android release artifacts retained: ${kept_android}"
          echo "Protected workflow runs: ${#KEEP_RUN[@]}"
          echo ""
          echo "Planned artifact deletions:"
          artifact_delete_count=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue
            echo "PLAN DELETE artifact=${artifact_id} name=${artifact_name} run=${artifact_run_id}"
            artifact_delete_count=$((artifact_delete_count + 1))
          done

          echo ""
          echo "Planned workflow-run deletions:"
          run_delete_count=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue
            [[ "$status" == "completed" ]] || continue
            echo "PLAN DELETE run=${run_id} workflow=${workflow_name} conclusion=${conclusion} created=${created_at}"
            run_delete_count=$((run_delete_count + 1))
          done

          echo ""
          echo "Validated plan: delete ${artifact_delete_count} artifacts and ${run_delete_count} completed workflow runs; retain ${kept_android} Android release artifacts."

          # ------------------------------------------------------------------
          # PHASE 2: DESTRUCTIVE. Re-check the retention guards immediately
          # before every deletion. Any ambiguity aborts instead of guessing.
          # ------------------------------------------------------------------
          deleted_artifacts=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue

            echo "DELETE artifact=${artifact_id} name=${artifact_name}"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted_artifacts=$((deleted_artifacts + 1))
          done

          deleted_runs=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue
            [[ "$status" == "completed" ]] || continue

            echo "DELETE run=${run_id} workflow=${workflow_name}"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted_runs=$((deleted_runs + 1))
          done

          echo "Cleanup complete: retained ${kept_android} Android release artifacts and their workflow runs; deleted ${deleted_artifacts} artifacts and ${deleted_runs} completed workflow runs."
