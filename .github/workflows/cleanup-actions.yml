name: Cleanup Actions Runs

on:
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    name: Retain Android releases and recent successful builds
    runs-on: ubuntu-latest
    steps:
      - name: Validate cleanup plan and remove non-retained data
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          ANDROID_ARTIFACT_PREFIX='avijit-sahyog-release-aab-'
          MAX_ANDROID_ARTIFACTS=5
          MAX_SUCCESSFUL_RUNS=10

          declare -A KEEP_ARTIFACT=()
          declare -A KEEP_RUN=()
          declare -A KNOWN_RUN=()
          declare -A SUCCESSFUL_RUN_COUNT=()

          # ------------------------------------------------------------------
          # PHASE 1: READ + VALIDATE. No DELETE calls are allowed before this
          # phase completes successfully.
          # ------------------------------------------------------------------
          mapfile -t ARTIFACTS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, (.workflow_run.id // 0), .name, .expired, .created_at] | @tsv' \
              | sort -t $'\t' -k5,5r
          )

          mapfile -t RUNS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs?per_page=100&exclude_pull_requests=true" \
              --jq '.workflow_runs[] | [.id, .name, .status, .conclusion, .created_at] | @tsv'
          )

          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            KNOWN_RUN["$run_id"]=1
          done

          # Retain the five newest non-expired Android release artifacts and
          # their associated workflow runs.
          android_candidates=0
          android_invalid=0
          kept_android=0

          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ "$artifact_name" == "${ANDROID_ARTIFACT_PREFIX}"* ]] || continue
            [[ "$artifact_expired" == "true" ]] && continue

            android_candidates=$((android_candidates + 1))

            if [[ "$artifact_run_id" == "0" || -z "${KNOWN_RUN[$artifact_run_id]:-}" ]]; then
              echo "ERROR: Android artifact ${artifact_id} (${artifact_name}) cannot be mapped to a known workflow run."
              android_invalid=$((android_invalid + 1))
              continue
            fi

            if [[ $kept_android -lt $MAX_ANDROID_ARTIFACTS ]]; then
              KEEP_ARTIFACT["$artifact_id"]=1
              KEEP_RUN["$artifact_run_id"]=1
              kept_android=$((kept_android + 1))
              echo "PLAN KEEP Android artifact=${artifact_id} name=${artifact_name} run=${artifact_run_id} created=${artifact_created_at}"
            fi
          done

          if [[ "$android_invalid" -gt 0 ]]; then
            echo "ERROR: Android artifact validation failed. NOTHING WILL BE DELETED."
            exit 1
          fi

          # Keep the last 10 successful runs PER WORKFLOW. This protects CI,
          # backend, Flutter, release, and other workflows independently.
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            [[ "$status" == "completed" && "$conclusion" == "success" ]] || continue
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue

            count=${SUCCESSFUL_RUN_COUNT["$workflow_name"]:-0}
            if [[ "$count" -lt "$MAX_SUCCESSFUL_RUNS" ]]; then
              KEEP_RUN["$run_id"]=1
              SUCCESSFUL_RUN_COUNT["$workflow_name"]=$((count + 1))
              echo "PLAN KEEP successful run=${run_id} workflow=${workflow_name} created=${created_at}"
            fi
          done

          for retained_run_id in "${!KEEP_RUN[@]}"; do
            if [[ -z "${KNOWN_RUN[$retained_run_id]:-}" ]]; then
              echo "ERROR: Protected run ${retained_run_id} is missing from the run snapshot. NOTHING WILL BE DELETED."
              exit 1
            fi
          done

          echo ""
          echo "VALIDATION PASSED"
          echo "Android release artifacts found: ${android_candidates}"
          echo "Android release artifacts retained: ${kept_android}"
          echo "Protected workflow runs: ${#KEEP_RUN[@]}"
          echo "Successful-run retention: last ${MAX_SUCCESSFUL_RUNS} per workflow"
          echo ""
          echo "Planned artifact deletions:"
          artifact_delete_count=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue
            echo "PLAN DELETE artifact=${artifact_id} name=${artifact_name} run=${artifact_run_id}"
            artifact_delete_count=$((artifact_delete_count + 1))
          done

          echo ""
          echo "Planned workflow-run deletions:"
          run_delete_count=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue
            [[ "$status" == "completed" ]] || continue
            echo "PLAN DELETE run=${run_id} workflow=${workflow_name} conclusion=${conclusion} created=${created_at}"
            run_delete_count=$((run_delete_count + 1))
          done

          echo ""
          echo "Validated plan: delete ${artifact_delete_count} artifacts and ${run_delete_count} completed workflow runs."

          # ------------------------------------------------------------------
          # PHASE 2: DESTRUCTIVE. Only objects excluded from the validated
          # retention sets are deleted.
          # ------------------------------------------------------------------
          deleted_artifacts=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"
            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue

            echo "DELETE artifact=${artifact_id} name=${artifact_name}"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted_artifacts=$((deleted_artifacts + 1))
          done

          deleted_runs=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name status conclusion created_at <<< "$run"
            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue
            [[ "$status" == "completed" ]] || continue

            echo "DELETE run=${run_id} workflow=${workflow_name}"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted_runs=$((deleted_runs + 1))
          done

          echo "Cleanup complete: retained ${kept_android} Android release artifacts, protected the last ${MAX_SUCCESSFUL_RUNS} successful runs per workflow, deleted ${deleted_artifacts} artifacts and ${deleted_runs} completed workflow runs."
