name: Cleanup Actions Runs

on:
  workflow_dispatch:
  # Enable scheduled cleanup later when Actions-hour usage allows it.
  # schedule:
  #   - cron: '17 2 * * *'

permissions:
  actions: write

jobs:
  cleanup:
    name: Retain five Android release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Remove non-Android artifacts and related workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          # Storage policy:
          # - Keep up to the 5 newest non-expired Android release AAB artifacts.
          # - Keep the workflow runs that produced those artifacts.
          # - Delete every other artifact.
          # - Delete every other completed workflow run.
          # - Never delete anything until the Android artifact -> workflow-run
          #   relationship has been validated. This makes a malformed API
          #   response fail closed instead of deleting everything.
          ANDROID_ARTIFACT_PREFIX='avijit-sahyog-release-aab-'

          declare -A KEEP_ARTIFACT=()
          declare -A KEEP_RUN=()

          mapfile -t ARTIFACTS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | [.id, (.workflow_run.id // 0), .name, .expired, .created_at] | @tsv' \
              | sort -t $'\t' -k5,5r
          )

          # Select the 5 newest valid Android release artifacts first.
          # Do not perform any deletion until this selection and its run IDs
          # have both been validated.
          kept_android=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"

            [[ "$artifact_name" == "${ANDROID_ARTIFACT_PREFIX}"* ]] || continue
            [[ "$artifact_expired" == "true" ]] && continue
            [[ "$artifact_run_id" == "0" ]] && continue

            if [[ $kept_android -lt 5 ]]; then
              KEEP_ARTIFACT["$artifact_id"]=1
              KEEP_RUN["$artifact_run_id"]=1
              kept_android=$((kept_android + 1))
              echo "Keeping Android artifact ${artifact_id} (${artifact_name}, run ${artifact_run_id}, ${artifact_created_at})"
            fi
          done

          # Fail closed. If Android artifacts exist but GitHub did not provide
          # their workflow-run relationship, deleting anything could destroy
          # the retained releases. If there are no Android artifacts at all,
          # also stop rather than interpreting that as permission to delete all
          # workflow history.
          android_candidates=$(printf '%s\n' "${ARTIFACTS[@]}" | awk -F '\t' -v prefix="$ANDROID_ARTIFACT_PREFIX" '$3 ~ "^" prefix && $4 != "true" {count++} END {print count+0}')
          if [[ "$android_candidates" -gt 0 && "$kept_android" -eq 0 ]]; then
            echo "ERROR: Android release artifacts were found, but none could be safely mapped to a workflow run. Nothing was deleted."
            exit 1
          fi

          if [[ "$kept_android" -gt 0 ]]; then
            echo "Validated ${kept_android} Android release artifact(s) and their workflow run IDs."
          else
            echo "No non-expired Android release artifacts currently exist. Nothing was deleted."
            exit 0
          fi

          # Delete non-retained artifacts only after the retention set is safe.
          deleted_artifacts=0
          for artifact in "${ARTIFACTS[@]}"; do
            IFS=$'\t' read -r artifact_id artifact_run_id artifact_name artifact_expired artifact_created_at <<< "$artifact"

            [[ -n "${KEEP_ARTIFACT[$artifact_id]:-}" ]] && continue

            echo "Deleting artifact ${artifact_id} (${artifact_name}, run ${artifact_run_id})"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/artifacts/${artifact_id}"
            deleted_artifacts=$((deleted_artifacts + 1))
          done

          # Delete completed workflow runs only after the retained run set is
          # known. Deleting a workflow run also deletes its artifacts, so the
          # KEEP_RUN guard is the critical protection for the five releases.
          mapfile -t RUNS < <(
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | [.id, .name, .conclusion, .created_at] | @tsv'
          )

          deleted_runs=0
          for run in "${RUNS[@]}"; do
            IFS=$'\t' read -r run_id workflow_name conclusion created_at <<< "$run"

            [[ "$run_id" == "$CURRENT_RUN_ID" ]] && continue
            [[ -n "${KEEP_RUN[$run_id]:-}" ]] && continue

            echo "Deleting workflow run ${run_id} (${workflow_name}, ${conclusion}, ${created_at})"
            gh api \
              --method DELETE \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              "/repos/${REPOSITORY}/actions/runs/${run_id}"
            deleted_runs=$((deleted_runs + 1))
          done

          echo "Cleanup complete; retained ${kept_android} Android release artifacts and their workflow runs; deleted ${deleted_artifacts} artifacts and ${deleted_runs} workflow runs."
