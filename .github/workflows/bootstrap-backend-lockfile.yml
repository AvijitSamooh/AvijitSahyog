name: Bootstrap backend lockfile

on:
  push:
    paths:
      - 'backend/nestjs/package.json'
      - '.github/workflows/bootstrap-backend-lockfile.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - name: Refresh lockfile
        working-directory: backend/nestjs
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile and remove bootstrap workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/bootstrap-backend-lockfile.yml
          git add backend/nestjs/package-lock.json .github/workflows/bootstrap-backend-lockfile.yml
          git commit -m 'chore(backend): refresh validation dependency lockfile'
          git push
