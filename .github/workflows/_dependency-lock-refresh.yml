name: Temporary backend dependency lock refresh

on:
  push:
    branches:
      - chore/backend-dependency-cleanup
  pull_request:
    types: [opened]
    branches: [master]

permissions:
  contents: write

jobs:
  refresh:
    if: github.head_ref == 'chore/backend-dependency-cleanup' || contains(github.event.head_commit.message, 'refresh backend dependencies')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/nestjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/nestjs/package-lock.json
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit refreshed lockfile and remove temporary workflow
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/nestjs/package-lock.json
          git rm .github/workflows/_dependency-lock-refresh.yml
          git commit -m "chore: refresh backend dependency lockfile"
          git push
