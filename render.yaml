# Avijit Sarthi API — Render Blueprint and environment-variable inventory.
# Never commit credentials here. sync:false entries must be supplied securely in Render.
services:
  - type: web
    name: avijit-sarthi-api
    runtime: node
    plan: free
    rootDir: backend/nestjs
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

      # Required Firebase Admin service-account credentials for Authentication and Firestore.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Browser origins allowed to call the API; configure as expected by the app.
      - key: CORS_ORIGINS
        sync: false

      # Required Cloudflare R2 configuration for media uploads/downloads.
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      # Optional public URL/base domain for serving uploaded media.
      - key: R2_PUBLIC_BASE_URL
        value: ""

      # Required secret used to sign/validate export tokens.
      - key: EXPORT_TOKEN_SECRET
        sync: false
