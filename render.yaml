# Avijit Sarthi API — Render Blueprint and environment-variable inventory.
# Never commit credentials here. sync:false entries must be supplied securely in Render.
services:
  - type: web
    name: avijit-sarthi-api
    runtime: node
    plan: free
    rootDir: backend/nestjs
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production

      # Required Firebase Admin service-account credentials for Authentication, Firestore and Storage.
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      # Required Firebase Storage bucket name, e.g. project-id.firebasestorage.app or project-id.appspot.com
      - key: FIREBASE_STORAGE_BUCKET
        sync: false

      # Browser origins allowed to call the API; configure as expected by the app.
      - key: CORS_ORIGINS
        sync: false

      # Required secret used to sign/validate export tokens.
      - key: EXPORT_TOKEN_SECRET
        sync: false
